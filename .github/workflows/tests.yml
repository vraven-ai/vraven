name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests examples benchmarks
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Documentation links
        run: python scripts/check_docs_site.py
      - name: Source completeness
        run: |
          test -z "$(find src/vraven -type f -empty -print)"
          ! grep -RInE '\bTODO\b|\bFIXME\b|NotImplementedError|^[[:space:]]*pass[[:space:]]*$' src/vraven

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install runtime and test tools
        run: python -m pip install torch numpy plotly networkx pytest
      - name: Build and smoke test wheel
        run: bash scripts/build_package.sh
