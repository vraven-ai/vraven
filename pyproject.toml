[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vraven"
version = "0.10.1"
description = "Evidence-aware explainability and causal model auditing for PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Daniel Jeremiah"}]
keywords = ["explainable-ai", "deep-learning", "pytorch", "mechanistic-interpretability", "causal-decompilation", "visualisation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "plotly>=6.1",
  "networkx>=3.2",
]

[project.urls]
Homepage = "https://vraven-ai.github.io/vraven/"
Documentation = "https://vraven-ai.github.io/vraven/"
Repository = "https://github.com/vraven-ai/vraven"
Issues = "https://github.com/vraven-ai/vraven/issues"

[project.optional-dependencies]
publication = [
  "kaleido>=1.0",
]
sklearn = [
  "scikit-learn>=1.4",
]
analysis = [
  "scipy>=1.11",
  "scikit-learn>=1.4",
]
darkside = [
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "ripser>=0.6.8",
]
dev = [
  "build>=1.2",
  "pandas>=2.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "svgwrite>=1.4",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
vraven = "vraven.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vraven = ["decompiler/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"examples/notebooks/*.ipynb" = ["B007", "E402", "F404", "I001"]
"examples/kronodroid/generate_cnn_full_report.py" = ["E402", "I001"]
"scripts/figures/*.py" = ["E402"]
"scripts/regen_*.py" = ["E402"]
"scripts/run_vraven_on_models.py" = ["E402"]
"scripts/validate_outputs.py" = ["E402"]
"tests/test_figures.py" = ["E402"]
